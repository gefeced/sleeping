<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050814" />
    <title>Sleep Analytics</title>
    <link rel="stylesheet" href="scripts/styles.css" />
  </head>
  <body data-page="analytics">
    <div id="background-layer"></div>
    <div id="app-container">
      <div class="app">
        <header class="topbar">
          <div class="topbar__title">
            <div class="appname">Sleep</div>
            <div class="subtitle">Analytics</div>
          </div>
          <div class="topbar__actions">
            <nav class="nav" aria-label="Primary navigation">
              <a class="nav__link" href="index.html">Home</a>
              <a class="nav__link" href="goals.html">Goals</a>
              <a class="nav__link" href="schedule.html">Schedule</a>
              <a class="nav__link is-active" href="analytics.html">Analytics</a>
              <a class="nav__link" href="history.html">History</a>
            </nav>
            <button id="infoButton" class="icon-button" type="button" aria-label="About this app" title="About">
              i
            </button>
          </div>
        </header>

        <main class="content">
        <section class="card">
          <div class="row">
            <div>
              <h1 class="h1">Trends</h1>
              <div class="muted">Sleep duration and consistency over time.</div>
            </div>
            <div id="analyticsSummary" class="pill pill--wide">—</div>
          </div>

          <div class="segmented" role="tablist" aria-label="Analytics view toggle">
            <button class="segmented__btn is-active" type="button" data-view="daily" role="tab">Daily</button>
            <button class="segmented__btn" type="button" data-view="weekly" role="tab">Weekly</button>
            <button class="segmented__btn" type="button" data-view="monthly" role="tab">Monthly</button>
          </div>

          <canvas id="analyticsCanvas" class="canvas canvas--tall" width="1000" height="520" aria-label="Sleep analytics graph"></canvas>
          <div id="analyticsLegend" class="legend" aria-hidden="true"></div>
        </section>

        <section class="card">
          <h2 id="sessionsTitle" class="h2">Sessions</h2>
          <div id="sessionsSubtitle" class="muted">Most recent sessions (tap to edit).</div>
          <div id="analyticsEmptyState" class="empty" hidden>
            <div class="empty__text">No sleep data yet.</div>
            <div class="empty__action">
              <a class="button button--primary" href="index.html" role="button">Record your first sleep</a>
            </div>
          </div>
          <div id="sessionList" class="session-list" aria-label="Sleep sessions list"></div>
        </section>
        </main>
      </div>
    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/time.js"></script>
    <script src="scripts/sleepTracker.js"></script>
    <script src="scripts/graphs.js"></script>
    <script src="scripts/ui.js"></script>
  </body>
</html>
